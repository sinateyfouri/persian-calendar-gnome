name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update
      - run: sudo apt-get install -y appstream desktop-file-utils libglib2.0-bin zip gjs gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: glib-compile-schemas --strict --dry-run extension/schemas
      - run: desktop-file-validate app/io.github.persian_calendar_gnome.desktop
      - run: appstreamcli validate --no-net app/io.github.persian_calendar_gnome.metainfo.xml
      - run: ./scripts/build-extension.sh
      - name: GTK smoke test
        run: |
          set +e
          output=$(dbus-run-session -- xvfb-run -a timeout 3s ./scripts/run-app.sh 2>&1)
          status=$?
          set -e
          test "$status" -eq 124
          test -z "$output"
      - uses: actions/upload-artifact@v4
        with:
          name: gnome-shell-extension
          path: dist/*.zip
